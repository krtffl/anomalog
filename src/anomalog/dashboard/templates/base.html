<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anomalog{% block title_suffix %}{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 1rem; max-width: 1200px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 1rem; }
        h2 { color: #8b949e; font-size: 1.1rem; margin: 1.5rem 0 0.5rem; }
        nav { margin-bottom: 1.5rem; }
        nav a { color: #58a6ff; text-decoration: none; margin-right: 1rem; }
        nav a:hover { text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; margin: 0.5rem 0; }
        th, td { padding: 0.5rem; text-align: left; border-bottom: 1px solid #21262d; }
        th { color: #8b949e; font-weight: 600; }
        .severity-low { color: #3498db; }
        .severity-medium { color: #f39c12; }
        .severity-high { color: #e67e22; }
        .severity-critical { color: #e74c3c; font-weight: bold; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 1rem; margin: 0.5rem 0; }
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0.5rem; }
        .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 3px; font-size: 0.8rem; }
        .badge-ok { background: #238636; }
        .badge-warn { background: #9e6a03; }
        code { background: #21262d; padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <h1>anomalog</h1>
    <nav>
        <a href="/">Overview</a>
        <a href="/alerts">Alerts</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
