[build-system]
requires = ["maturin>=1.7"]
build-backend = "maturin"

[project]
name = "anomalog"
version = "0.1.0"
description = "Self-hosted ML anomaly detection for your logs"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "click>=8.1",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "numpy>=2.1",
    "duckdb>=1.2",
    "joblib>=1.4",
    "watchdog>=6.0",
    "httpx>=0.28",
    "jinja2>=3.1",
    "aiosmtplib>=3.0",
    "structlog>=24.4",
    "apscheduler>=3.10,<4",
    "pytz>=2026.1.post1",
]

[project.optional-dependencies]
pro = [
    "statsforecast>=2.0",
    "statsmodels>=0.14",
    "prometheus-client>=0.21",
    "opentelemetry-proto>=1.28",
    "protobuf>=5.29",
]

[project.scripts]
anomalog = "anomalog.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.maturin]
python-source = "src"
module-name = "anomalog._rust"
features = ["pyo3/extension-module"]
manifest-path = "rust/Cargo.toml"

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
